<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng concept</title>
<!-- Mẫu từ sketch-to-concept/templates/concept-board.html. Chép thành concept/index.html, KHÔNG sửa file này:
     mọi nội dung lấy từ concepts.js. Cùng thư mục cần: concepts.js, tokens.js, theme.js, a.html, b.html, c.html. -->
<script src="theme.js"></script>
<script src="concepts.js"></script>
<script src="tokens.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Màu của khung bảng dùng tiền tố --ui- để không đè token của concept (--bg, --ink, --primary…) */
  :root{--ui-bg:#F6F6F4;--ui-surface:#FFFFFF;--ui-ink:#1A1A19;--ui-muted:#5E5E5A;--ui-line:#E2E2DE;--ui-focus:#2459C7;--ui-warn-bg:#FFF4D6;--ui-warn-ink:#5C4200;--ui-bad:#B3261E}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ui-bg:#111110;--ui-surface:#1A1A19;--ui-ink:#EDEDEA;--ui-muted:#A1A19C;--ui-line:#2C2C2A;--ui-focus:#8AB4FF;--ui-warn-bg:#3A2E0A;--ui-warn-ink:#FFE2A0;--ui-bad:#FF8A80}}
  :root[data-theme="dark"]{--ui-bg:#111110;--ui-surface:#1A1A19;--ui-ink:#EDEDEA;--ui-muted:#A1A19C;--ui-line:#2C2C2A;--ui-focus:#8AB4FF;--ui-warn-bg:#3A2E0A;--ui-warn-ink:#FFE2A0;--ui-bad:#FF8A80}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ui-bg);color:var(--ui-ink);font:15px/1.55 'Be Vietnam Pro',system-ui,sans-serif}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--ui-focus);outline-offset:2px}
  .wrap{max-width:1600px;margin:0 auto;padding:24px 16px 64px}
  .top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
  h1{margin:0;font-size:28px;line-height:1.2}
  .project{margin:4px 0 0;color:var(--ui-muted)}
  .controls{display:flex;flex-wrap:wrap;gap:12px}
  .seg{display:inline-flex;border:1px solid var(--ui-line);border-radius:8px;overflow:hidden}
  .seg span{padding:8px 10px;color:var(--ui-muted);font-size:13px}
  .seg button{border:0;border-left:1px solid var(--ui-line);background:var(--ui-surface);color:var(--ui-ink);padding:8px 14px;font:inherit;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--ui-ink);color:var(--ui-bg)}
  .banner{margin:20px 0 0;padding:12px 16px;border-radius:8px;background:var(--ui-warn-bg);color:var(--ui-warn-ink)}
  details.brief{margin:20px 0 0;background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:10px;padding:12px 16px}
  details.brief summary{cursor:pointer;font-weight:600}
  .brief dl{display:grid;grid-template-columns:minmax(90px,max-content) 1fr;gap:6px 16px;margin:12px 0 0}
  .brief dt{color:var(--ui-muted)}
  .brief dd{margin:0}
  .brief small{color:var(--ui-muted)}
  .tiles{display:grid;gap:20px;margin-top:24px;grid-template-columns:1fr}
  @media (min-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .tile{background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
  .head{padding:16px 16px 12px}
  .tag{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ui-muted)}
  .letter{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ui-ink);color:var(--ui-bg);font-weight:700}
  .rec{padding:2px 8px;border:1px solid var(--ui-ink);border-radius:999px;color:var(--ui-ink)}
  .head h2{margin:10px 0 4px;font-size:22px;line-height:1.25}
  .idea{margin:0;font-size:16px}
  .facts{display:grid;grid-template-columns:minmax(96px,max-content) minmax(0,1fr);gap:4px 12px;margin:12px 0 0;font-size:13px}
  .facts dt{color:var(--ui-muted)}
  .facts dd{margin:0;overflow-wrap:anywhere}
  /* Vùng mẫu: chạy bằng token của concept */
  .spec{padding:16px;background-color:var(--bg);background-image:var(--texture);background-size:var(--texture-size);color:var(--ink);font-family:var(--font-body);border-top:1px solid var(--ui-line)}
  .spec h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--muted);font-family:var(--font-body)}
  .spec section+section{margin-top:18px}
  .sw{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
  .sw li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 8px;align-items:center;font-size:12px;line-height:1.3}
  .sw .chip{grid-row:span 2;width:22px;height:22px;border-radius:50%;border:1px solid var(--line)}
  .sw code{color:var(--muted);font-family:var(--font-mono,ui-monospace),monospace}
  .ct{list-style:none;margin:0;padding:0;font-size:12px}
  .ct li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
  .ct b{font-weight:600}
  .ct b.bad{color:var(--destructive)}
  .display{margin:0;font-family:var(--font-display);font-size:28px;line-height:1.2;overflow-wrap:anywhere}
  .bodytext{margin:8px 0 0;color:var(--muted)}
  .mono{margin:8px 0 0;font-family:var(--font-mono,var(--font-body));font-size:13px}
  .ui{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .btn{border:var(--border-width,1px) solid transparent;border-radius:var(--radius-md);padding:10px 16px;font:500 14px/1.2 var(--font-body);cursor:pointer;transition:transform .15s ease,opacity .15s ease}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
  .btn-primary{background:var(--primary);color:var(--on-primary)}
  .btn-secondary{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .badge{display:inline-block;padding:3px 10px;border-radius:var(--radius-sm);background:var(--muted-bg);color:var(--muted);font-size:12px}
  .field{display:grid;gap:4px;margin-top:10px;font-size:13px}
  .field input{min-width:0;padding:9px 12px;border-radius:var(--radius-md);border:var(--border-width,1px) solid var(--line);background:var(--surface);color:var(--card-foreground);font:14px var(--font-body)}
  .field input:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
  .card{margin-top:10px;padding:14px;border-radius:var(--radius-lg);background:var(--surface);color:var(--card-foreground);box-shadow:var(--shadow);border:var(--border-width,1px) solid var(--line)}
  .card p{margin:4px 0 0;font-size:13px}
  .shapes{display:flex;gap:10px;align-items:flex-end;font-size:11px;color:var(--muted)}
  .shapes div{width:44px;height:44px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:end center;padding-bottom:2px}
  .shot{padding:16px;border-top:1px solid var(--ui-line)}
  .shot p{margin:0 0 8px;font-size:13px;color:var(--ui-muted)}
  .frame{position:relative;overflow:hidden;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-bg)}
  .frame iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:#FFFFFF}
  section.block{margin-top:32px;background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:12px;padding:16px}
  section.block h2{margin:0 0 8px;font-size:20px}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
  th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--ui-line)}
  thead th{color:var(--ui-muted);font-weight:600}
  .warn{margin:12px 0 0;padding:10px 14px;border-radius:8px;background:var(--ui-warn-bg);color:var(--ui-warn-ink)}
  .warn ul{margin:6px 0 0;padding-left:20px}
  [hidden]{display:none!important}
  .okline{margin:12px 0 0;color:var(--ui-muted)}
  .mixgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:12px 0}
  .mixgrid label{display:grid;gap:4px;font-size:13px;color:var(--ui-muted)}
  .mixgrid select{padding:8px 10px;border-radius:8px;border:1px solid var(--ui-line);background:var(--ui-surface);color:var(--ui-ink);font:inherit}
  .code{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 12px}
  .code output{font-family:ui-monospace,Consolas,monospace;padding:6px 10px;border-radius:6px;background:var(--ui-bg);border:1px solid var(--ui-line)}
  .code button{border:1px solid var(--ui-line);background:var(--ui-surface);color:var(--ui-ink);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Bảng concept</h1>
      <p class="project" data-project></p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Nền"><span>Nền</span><button type="button" data-set-theme="light">Sáng</button><button type="button" data-set-theme="dark">Tối</button></div>
      <div class="seg" role="group" aria-label="Khổ màn xem trước"><span>Khổ màn</span><button type="button" data-set-width="1440">1440</button><button type="button" data-set-width="390">390</button></div>
    </div>
  </header>
  <div data-banner-slot></div>
  <div class="warn" role="alert" data-board-error hidden></div>
  <details class="brief" open><summary>Brief concept</summary><dl data-brief></dl></details>
  <main>
    <div class="tiles" data-tiles></div>
    <section class="block" aria-labelledby="cmp-h">
      <h2 id="cmp-h">So trục</h2>
      <div class="scroll"><table data-axes></table></div>
      <div data-axes-result></div>
    </section>
    <section class="block" aria-labelledby="mix-h">
      <h2 id="mix-h">Trộn</h2>
      <p>Ghép các lớp của nhiều concept rồi xem ngay trên màn. Dán mã trộn vào chat để agent làm theo.</p>
      <div class="mixgrid">
        <label>Màn và ý<select data-mix="man"></select></label>
        <label>Màu<select data-mix="mau"></select></label>
        <label>Chữ<select data-mix="chu"></select></label>
        <label>Nút và hình khối<select data-mix="nut"></select></label>
      </div>
      <p class="code">Mã trộn: <output data-mix-code></output><button type="button" data-copy>Sao chép</button><span role="status" data-copy-status></span></p>
      <div class="frame" data-frame><iframe data-mix-preview title="Xem trước bản trộn" tabindex="-1"></iframe></div>
    </section>
  </main>
</div>
<script>
(() => {
  const T = window.ConceptTokens, D = window.CONCEPTS;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Thiếu file hoặc dữ liệu sai quy ước: báo rõ rồi dừng, không dựng bảng dở dang
  const fail = msgs => {
    const box = $('[data-board-error]');
    box.innerHTML = `<strong>Chưa dựng được bảng concept.</strong><ul>${msgs.map(m => `<li>${esc(m)}</li>`).join('')}</ul>`;
    box.hidden = false;
    $('details.brief').hidden = true;
    $('main').hidden = true;
  };
  const missing = [];
  if (!D) missing.push('Không đọc được concepts.js: kiểm file nằm cùng thư mục với index.html và không có lỗi cú pháp.');
  if (!T) missing.push('Không đọc được tokens.js: chép từ sketch-to-concept/templates/tokens.js vào cùng thư mục với index.html.');
  if (missing.length) return fail(missing);
  const problems = T.validate(D);
  if (problems.length) return fail(problems);
  const L = id => String(id).toUpperCase();
  const ROLE = { background: 'Nền', foreground: 'Chữ chính', card: 'Mặt thẻ', 'card-foreground': 'Chữ trên thẻ', muted: 'Nền phụ',
    'muted-foreground': 'Chữ phụ', border: 'Đường kẻ', primary: 'Màu chính', 'on-primary': 'Chữ trên màu chính', secondary: 'Màu phụ',
    'on-secondary': 'Chữ trên màu phụ', accent: 'Màu nhấn', 'on-accent': 'Chữ trên màu nhấn', destructive: 'Lỗi', 'on-destructive': 'Chữ trên màu lỗi',
    ring: 'Vòng focus', success: 'Thành công', warning: 'Cảnh báo' };
  const AXIS = { nen: 'Nền', chatNen: 'Chất nền', chu: 'Tính cách chữ', yTuong: 'Trục ý tưởng', khoanhKhac: 'Khoảnh khắc đọc lần hai', khung: 'Khung bố cục' };
  const SIZE = { 1440: [1440, 900], 390: [390, 844] };
  let width = 1440;
  const mode = () => (window.theme ? window.theme.get() : 'light');
  const palette = c => (mode() === 'dark' && c.colors.dark) || c.colors.light || c.colors.dark;
  const ratio = r => (r === null ? 'Không đo được' : r.toFixed(2).replace('.', ',') + ':1');
  const screenSrc = (id, mix) => `${id}.html?theme=${mode()}` + (mix ? `&mix=${encodeURIComponent(mix)}` : '');

  document.title = `Bảng concept · ${D.project}`;
  $('[data-project]').textContent = D.project;
  if (D.example) $('[data-banner-slot]').innerHTML = '<p class="banner" data-example-banner>Đang hiện dữ liệu mẫu của khuôn. Thay toàn bộ concepts.js bằng dữ liệu của dự án, rồi xoá dòng example: true.</p>';
  $('[data-brief]').innerHTML = (D.brief || []).map(b => `<dt>${esc(b.label)}</dt><dd>${esc(b.text)} <small>(${esc(b.source)})</small></dd>`).join('');

  // Token của mỗi concept gói trong vùng #tile-<id>; font của cả 3 concept nạp một lần
  const scoped = document.createElement('style');
  scoped.textContent = D.concepts.map(c => T.cssText(c, `#tile-${c.id}`)).join('\n');
  document.head.appendChild(scoped);
  for (const c of D.concepts) {
    const href = T.fontsHref(c);
    if (href) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; document.head.appendChild(l); }
  }

  function tile(c) {
    const p = palette(c), k = D.content || {};
    const only = !(c.colors.light && c.colors.dark) ? `<span>chỉ có nền ${c.colors.dark ? 'tối' : 'sáng'}</span>` : '';
    const rows = T.checkPairs(p).map(r => `<li data-contrast="${esc(r.fg)}" data-grade="${esc(r.grade)}"><span>${esc(r.label)}</span>` +
      `<span data-ratio>${ratio(r.ratio)}</span><b class="${r.grade === 'Không đạt' ? 'bad' : ''}">${esc(r.grade)}</b></li>`).join('');
    const sw = Object.keys(p).map(role => `<li><span class="chip" style="background:var(--${esc(T.varName(role))})"></span><span>${esc(ROLE[role] || role)}</span><code>${esc(p[role])}</code></li>`).join('');
    const ff = c.fontFamily || {};
    const r = (c.shape && c.shape.radius) || {};
    return `<article class="tile" id="tile-${esc(c.id)}" data-tile="${esc(c.id)}" aria-labelledby="t-${esc(c.id)}">
      <div class="head">
        <div class="tag"><span class="letter">${L(c.id)}</span>${c.recommended ? '<span class="rec">Khuyến nghị</span>' : ''}<span>${esc(c.family)} · dial ${esc(c.dial)}</span>${only}</div>
        <h2 id="t-${esc(c.id)}">${esc(c.name)}</h2>
        <p class="idea">${esc(c.idea)}</p>
        <dl class="facts">
          <dt>Ẩn dụ</dt><dd>${esc(c.metaphor)}</dd>
          <dt>Form từ đâu</dt><dd>${esc(c.formFrom)}</dd>
          <dt>Tương tác</dt><dd>${esc(c.signature)}</dd>
          <dt>Nguồn</dt><dd>${esc(c.source && c.source.kind)}. ${esc(c.source && c.source.ref)}</dd>
        </dl>
      </div>
      <div class="spec">
        <section><h3>Chữ: ${[ff.display, ff.body, ff.mono].filter(Boolean).map(f => (f === T.PLATFORM ? 'font nền tảng' : esc(f))).join(' · ')}</h3>
          <p class="display">${esc(k.headline)}</p><p class="bodytext">${esc(k.body)}</p>${k.numbers ? `<p class="mono">${esc(k.numbers)}</p>` : ''}</section>
        <section><h3>Thành phần</h3>
          <div class="ui"><button type="button" class="btn btn-primary">${esc(k.cta)}</button><button type="button" class="btn btn-secondary">${esc(k.secondary)}</button><button type="button" class="btn btn-primary" disabled>Đang tắt</button><span class="badge">${esc(k.badge)}</span></div>
          <label class="field">${esc(k.inputLabel)}<input type="text" placeholder="${esc(k.inputPlaceholder)}"></label>
          <div class="card"><strong>${esc(k.cardTitle)}</strong><p>${esc(k.cardText)}</p></div></section>
        <section><h3>Màu theo vai trò</h3><ul class="sw">${sw}</ul></section>
        <section><h3>Tương phản</h3><ul class="ct">${rows}</ul></section>
        <section><h3>Bo góc · bóng · chất nền</h3><div class="shapes">${['sm', 'md', 'lg'].filter(x => r[x]).map(x => `<div style="border-radius:var(--radius-${x})">${x}</div>`).join('')}</div></section>
      </div>
      <div class="shot"><p>Màn then chốt · <a href="${esc(c.id)}.html" target="_blank" rel="noopener">mở màn riêng</a></p>
        <div class="frame" data-frame><iframe data-screen="${esc(c.id)}" src="${esc(screenSrc(c.id))}" title="Màn then chốt của concept ${L(c.id)}" tabindex="-1"></iframe></div></div>
    </article>`;
  }

  function axes() {
    const cs = D.concepts;
    $('[data-axes]').innerHTML = `<thead><tr><th scope="col">Trục</th>${cs.map(c => `<th scope="col">${L(c.id)} · ${esc(c.name)}</th>`).join('')}</tr></thead>` +
      `<tbody>${T.AXES.map(a => `<tr data-axes-row><th scope="row">${AXIS[a]}</th>${cs.map(c => `<td>${esc(c.axes && c.axes[a])}</td>`).join('')}</tr>`).join('')}</tbody>`;
    const bad = T.diffAxes(D).filter(d => !d.ok);
    $('[data-axes-result]').innerHTML = bad.length
      ? bad.map(d => `<p class="warn" data-axes-warning>${L(d.a)} và ${L(d.b)} mới khác nhau ở ${d.differ.length} trục (${d.differ.map(a => AXIS[a]).join(', ') || 'không trục nào'})` +
          `${d.differ.includes('khung') ? '' : ', và chung khung bố cục'}. Cần khác nhau ít nhất 3 trục, trong đó có khung bố cục.</p>`).join('')
      : '<p class="okline">Mỗi cặp concept khác nhau ít nhất 3 trục, và khác khung bố cục.</p>';
  }

  function mixState() {
    const m = {};
    for (const s of document.querySelectorAll('[data-mix]')) m[s.dataset.mix] = s.value;
    return m;
  }
  function updateMix() {
    const code = T.formatMix(mixState());
    $('[data-mix-code]').textContent = code;
    $('[data-mix-preview]').setAttribute('src', screenSrc(mixState().man, code));
  }
  function fit() {
    const [w, h] = SIZE[width];
    for (const f of document.querySelectorAll('[data-frame]')) {
      const fr = f.querySelector('iframe'), W = f.clientWidth, s = Math.min(1, W / w);
      Object.assign(fr.style, { width: w + 'px', height: h + 'px', transform: `scale(${s})`, left: Math.max(0, (W - w * s) / 2) + 'px' });
      f.style.height = Math.round(h * s) + 'px';
    }
  }
  function pressed() {
    for (const b of document.querySelectorAll('[data-set-theme]')) b.setAttribute('aria-pressed', String(b.dataset.setTheme === mode()));
    for (const b of document.querySelectorAll('[data-set-width]')) b.setAttribute('aria-pressed', String(+b.dataset.setWidth === width));
  }
  function render() {
    $('[data-tiles]').innerHTML = D.concepts.map(tile).join('');
    updateMix();
    pressed();
    fit();
  }

  const first = (D.concepts.find(c => c.recommended) || D.concepts[0]).id;
  for (const s of document.querySelectorAll('[data-mix]')) {
    s.innerHTML = D.concepts.map(c => `<option value="${esc(c.id)}">${L(c.id)} · ${esc(c.name)}</option>`).join('');
    s.value = first;
    s.addEventListener('change', updateMix);
  }
  for (const b of document.querySelectorAll('[data-set-theme]')) b.addEventListener('click', () => { window.theme.set(b.dataset.setTheme); render(); });
  for (const b of document.querySelectorAll('[data-set-width]')) b.addEventListener('click', () => { width = +b.dataset.setWidth; pressed(); fit(); });
  $('[data-copy]').addEventListener('click', async () => {
    const code = $('[data-mix-code]').textContent, st = $('[data-copy-status]');
    try { await navigator.clipboard.writeText(code); st.textContent = 'Đã chép.'; }
    catch (e) { st.textContent = 'Trình duyệt chặn chép. Chọn mã rồi chép tay.'; }
  });
  addEventListener('resize', fit);
  axes();
  render();
})();
</script>
</body>
</html>
